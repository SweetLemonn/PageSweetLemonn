${admin?`<div class="adm">🔑 Modo administrador <button class="btn s" onclick="editProd()">+ Producto</button><button class="btn s g" onclick="editShop()">Ajustes de la tienda</button></div>`:''}
<main class="grid">${D.products.map(card).join('')||'<p>Aún no hay productos.</p>'}</main><footer>${esc(s.pay)}</footer>`}
const uTxt=p=>(p.units?`<p>📦 Trae ${p.units} ${p.units==1?'unidad':'unidades'}</p>`:'')+(p.min>1?`<p>🛒 Pedido mínimo: ${p.min} unidades</p>`:'');
const card=p=>`<article class="card"><div class="ph">${imgsOf(p).length?`<img src="${imgsOf(p)[0]}" alt="${esc(p.name)}" onclick="lb('${p.id}',0)">${imgsOf(p).length>1?`<span style="position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:2px 9px;font:600 .75rem system-ui,sans-serif;pointer-events:none">📷 ${imgsOf(p).length}</span>`:''}`:'🍰'}</div><div class="b"><h3>${esc(p.name)}</h3><p>${esc(p.desc)}</p>${uTxt(p)}<div class="r"><b>${p.opts.length?'desde ':''}${money(p.price)}</b><button class="btn s" onclick="openProd('${p.id}')">Elegir</button>${admin?`<button class="btn s g" onclick="editProd('${p.id}')">Editar</button>`:''}</div></div></article>`;

function openProd(id){const p=D.products.find(x=>x.id==id);
M(`<h2>${esc(p.name)}</h2>${imgsOf(p).length?`<img class="big zi" src="${imgsOf(p)[0]}" alt="" onclick="lb('${p.id}',0)">`:''}${imgsOf(p).length>1?`<div class="th">${imgsOf(p).map((s,k)=>`<div><img src="${s}" alt="" onclick="lb('${p.id}',${k})"></div>`).join('')}</div>`:''}<p>${esc(p.desc)}</p>${uTxt(p)}
${p.opts.map((g,i)=>`<label>${esc(g.name)}<select id="o${i}">${g.choices.map((c,j)=>`<option value="${j}">${esc(c[0])}${c[1]?' (+'+money(c[1])+')':''}</option>`).join('')}</select></label>`).join('')}
${p.msg?`<label>Mensaje o dedicatoria<input id="msg" maxlength="60" placeholder="Ej: Feliz cumple Ana"></label>`:''}
<label>Cantidad${p.min>1?` <small>(mínimo ${p.min})</small>`:''}<input id="qty" type="number" min="${p.min||1}" value="${p.min||1}"></label>
<button class="btn" onclick="addCart('${p.id}')">🛒 Agregar al carrito</button><button class="btn g" onclick="addCart('${p.id}',true)">💬 Pedir ya por WhatsApp</button>`)}
function toast(t){let e=$('#toast');if(!e){e=document.createElement('div');e.id='toast';e.style.cssText='position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ac);color:var(--bt);padding:10px 18px;border-radius:999px;font:600 .9rem system-ui,sans-serif;z-index:20;box-shadow:0 4px 14px rgba(0,0,0,.25)';document.body.appendChild(e)}e.textContent=t;e.hidden=false;clearTimeout(e._t);e._t=setTimeout(()=>{e.hidden=true},2200)}
function goWA(items){const w=waNum(D.shop.ow)||waNum(D.shop.wa);if(!w){alert('La tienda todavía no configuró su WhatsApp.');return}
const t=`🛒 *NUEVO PEDIDO – ${D.shop.name}*\n\n`+items.map((c,k)=>`${k+1}. ${c.qty}x ${c.name}${c.units?' (trae '+c.units+' u.)':''}${c.o.length?' ('+c.o.map(x=>x[0]+': '+x[1]).join(', ')+')':''}${c.msg?' – Mensaje: "'+c.msg+'"':''} – ${money(c.unit*c.qty)}`).join('\n')+`\n\n*Total: ${money(items.reduce((a,c)=>a+c.unit*c.qty,0))}*`;
window.open('https://wa.me/'+w+'?text='+encodeURIComponent(t),'_blank')}
function addCart(id,now){const p=D.products.find(x=>x.id==id);let unit=p.price;const o=p.opts.map((g,i)=>{const c=g.choices[+$('#o'+i).value];unit+=c[1];return[g.name,c[0]]});
const q=+$('#qty').value||1,mn=p.min||1;if(q<mn){alert('El pedido mínimo de "'+p.name+'" es de '+mn+' '+(mn==1?'unidad':'unidades')+'.');return}
const it=({name:p.name,units:p.units||0,o,msg:p.msg?$('#msg').value.trim():'',qty:q,unit});if(now){goWA([it]);return}cart.push(it);X();render();toast('✓ Agregado al carrito')}
function openCart(){
M(`<h2>Tu pedido</h2>${cart.length?cart.map((c,i)=>`<div class="it"><div><b>${c.qty}× ${esc(c.name)}</b>${c.units?' <small>(trae '+c.units+' u.)</small>':''}<br><small>${esc(c.o.map(x=>x[0]+': '+x[1]).join(' · '))}${c.msg?' · “'+esc(c.msg)+'”':''}</small></div><div>${money(c.unit*c.qty)}<br><button class="btn s g" onclick="rm(${i})">Quitar</button></div></div>`).join('')+`<b>Total: ${money(total())}</b>
<label>Fecha de entrega o retiro<input id="cd" type="date"></label><label>Notas<textarea id="cx" rows="2"></textarea></label>
<small>Se abrirá WhatsApp con tu pedido ya escrito: solo tocá “Enviar”.</small><button class="btn" onclick="send()">Enviar pedido por WhatsApp</button>`:'<p>El carrito está vacío.</p>'}`)}
function rm(i){cart.splice(i,1);render();openCart()}
function send(){
const w=waNum(D.shop.ow)||waNum(D.shop.wa);if(!w){alert('La tienda todavía no configuró su WhatsApp.');return}
const t=`🛒 *NUEVO PEDIDO – ${D.shop.name}*\n\n`+cart.map((c,k)=>`${k+1}. ${c.qty}x ${c.name}${c.units?' (trae '+c.units+' u.)':''}${c.o.length?' ('+c.o.map(x=>x[0]+': '+x[1]).join(', ')+')':''}${c.msg?' – Mensaje: "'+c.msg+'"':''} – ${money(c.unit*c.qty)}`).join('\n')+`\n\n*Total: ${money(total())}*\n📅 Entrega: ${$('#cd').value||'a coordinar'}\n📝 Notas: ${$('#cx').value||'-'}`;
window.open('https://wa.me/'+w+'?text='+encodeURIComponent(t),'_blank')}

/* ---- Administración ---- */
function editProd(id){const p=D.products.find(x=>x.id==id)||{name:'',desc:'',price:0,imgs:[],msg:false,opts:[]};pimgs=[...imgsOf(p)];
M(`<h2>${id?'Editar':'Nuevo'} producto</h2>
<label>Nombre<input id="pn" value="${esc(p.name)}"></label>
<label>Descripción<textarea id="pd" rows="2">${esc(p.desc)}</textarea></label>
<label>Precio base<input id="pp" type="number" min="0" value="${p.price}"></label>
<label>Unidades que trae (opcional)<input id="pu" type="number" min="1" value="${p.units||''}" placeholder="Ej: 12 — dejalo vacío si no aplica"></label>
<label>Pedido mínimo en unidades (opcional)<input id="pmn" type="number" min="1" value="${p.min||''}" placeholder="Ej: 6 — dejalo vacío si no hay mínimo"></label>
<label>Fotos (podés elegir varias, máximo 6)<input id="pf" type="file" accept="image/*" multiple onchange="addImgs(this)"></label><div id="pv" class="th">${thumbs()}</div>
<label>Personalización (una línea por opción)<textarea id="po" rows="4" placeholder="Tamaño: 8 porciones, 12 porciones +6000&#10;Sabor: Vainilla, Chocolate">${esc(optsText(p.opts))}</textarea><small>Formato: Nombre: opción, opción +precio extra</small></label>
<label class="ck"><input id="pm" type="checkbox" ${p.msg?'checked':''}> Permitir mensaje / dedicatoria</label>
<button class="btn" onclick="saveProd('${id||''}')">Guardar y publicar</button>${id?`<button class="btn d" onclick="delProd('${id}',this)">Eliminar producto</button>`:''}`)}
const thumbs=()=>pimgs.map((s,k)=>`<div><img src="${s}" alt="" onclick="L={a:pimgs,i:${k}};lbShow()"><button type="button" class="rx" onclick="delImg(${k})" aria-label="Quitar foto">✕</button></div>`).join('')||'<small>Sin fotos</small>';
const shrink=f=>new Promise(r=>{const i=new Image();i.onload=()=>{const s=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.8))};i.onerror=()=>r(null);i.src=URL.createObjectURL(f)});
async function addImgs(el){for(const f of [...el.files]){if(pimgs.length>=6){alert('Máximo 6 fotos por producto.');break}const d=await shrink(f);if(d)pimgs.push(d)}el.value='';$('#pv').innerHTML=thumbs()}
function delImg(k){pimgs.splice(k,1);$('#pv').innerHTML=thumbs()}
function pick(el){const f=el.files[0];if(!f)return;const i=new Image();i.onload=()=>{const s=Math.min(1,800/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ti=c.toDataURL('image/jpeg',.78);$('#pv').innerHTML=`<img class="big" src="${ti}" alt="">`};i.src=URL.createObjectURL(f)}
async function saveProd(id){const n=$('#pn').value.trim();if(!n){alert('Poné un nombre');return}
const p={id:id||Date.now().toString(36),name:n,desc:$('#pd').value.trim(),price:+$('#pp').value||0,units:Math.max(0,parseInt($('#pu').value)||0),min:Math.max(0,parseInt($('#pmn').value)||0),imgs:pimgs.slice(),img:'',msg:$('#pm').checked,opts:parseOpts($('#po').value)};
const i=D.products.findIndex(x=>x.id==id);i>=0?D.products[i]=p:D.products.push(p);await save()}
async function delProd(id,b){if(!b.dataset.ok){b.dataset.ok='1';b.textContent='¿Seguro? Tocá otra vez para eliminar';setTimeout(()=>{b.dataset.ok='';b.textContent='Eliminar producto'},4000);return}
b.disabled=true;b.textContent='Eliminando...';D.products=D.products.filter(x=>x.id!=id);await save()}
function editShop(){const s=D.shop;ti=s.logo;M(`<h2>Ajustes de la tienda</h2>
<label>Logo de la tienda<input id="pf" type="file" accept="image/*" onchange="pick(this)"></label><div id="pv">${s.logo?`<img class="lg" src="${s.logo}" alt="">`:''}</div>${s.logo?`<button type="button" class="btn s g" onclick="ti='';$('#pv').innerHTML='<small>Sin logo (se guarda al publicar)</small>'">Quitar logo</button>`:''}<label>Nombre<input id="sn" value="${esc(s.name)}"></label><label>Frase<input id="st" value="${esc(s.tag)}"></label>
<label>Link o número de WhatsApp<input id="sw" value="${esc(s.wa)}" placeholder="https://wa.me/5491122334455"><small>Pegá tu link de WhatsApp o tu número con código de país.</small></label><label>WhatsApp personal para recibir los pedidos (opcional)<input id="sow" value="${esc(s.ow||'')}" placeholder="5491122334455"><small>Si lo dejás vacío, los pedidos llegan al WhatsApp de arriba.</small></label><label>Texto junto al logo de WhatsApp<input id="swt" value="${esc(s.wat)}" placeholder="Pedidos por WhatsApp"></label><label>Link de Instagram<input id="si" value="${esc(s.ig)}" placeholder="https://instagram.com/sweetlemonn"><small>Pegá el link de tu perfil (también sirve solo el usuario).</small></label><label>Texto junto al logo de Instagram<input id="sit" value="${esc(s.igt)}" placeholder="@sweetlemonn"></label>
<label>Texto de pagos / entregas<textarea id="sp" rows="2">${esc(s.pay)}</textarea></label>
<button class="btn" onclick="saveShop()">Guardar y publicar</button>`)}
async function saveShop(){D.shop={name:$('#sn').value.trim()||'SweetLemonn',tag:$('#st').value.trim(),logo:ti||'',wa:$('#sw').value.trim(),ow:$('#sow').value.trim(),wat:$('#swt').value.trim(),ig:$('#si').value.trim(),igt:$('#sit').value.trim(),pay:$('#sp').value.trim()};await save()}
async function save(){try{const a=await claude.use('artifact');if(!a){alert('No se pudo guardar (sin permisos).');return}
const css=document.getElementById('css').textContent,code=document.getElementById('code').textContent,j=JSON.stringify(D).replace(/</g,'\\u003c'),S='<'+'/script>';
const html='<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>'+esc(D.shop.name)+'</title><style id="css">'+css+'</style></head><body><div id="app"></div><div id="modal" class="ov" hidden></div><script id="data" type="application/json">'+j+S+'<script id="code">'+code+S+'</body></html>';
await a.publish(html)}catch(e){alert('Error al guardar: '+(e.message||e.code||e))}}

render();
(async()=>{try{const u=await claude.use('user');admin=!!(u&&(u.isOwner()||u.canEdit()));render()}catch(e){}})();
</script></body></html>
